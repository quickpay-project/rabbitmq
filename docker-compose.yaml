version: "3.9"

services:
  app:
    build: .
    container_name: golang-app
    depends_on:
      - rabbitmq
    ports:
      - "4000:4001"
    env_file:
      - .env
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    volumes:
      - .:/app
    working_dir: /app
    command: go run main.go

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_VM_MEMORY_HIGH_WATERMARK: 0.8
      RABBITMQ_VM_MEMORY_CALCULATION_STRATEGY: allocated
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq   # เพิ่ม volume
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  rabbitmq_data:
    driver: local